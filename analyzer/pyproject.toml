[project]
name = "document-trilingual-analyzer"
version = "1.0.0"
description = "Extracts text from controlled documents and measures EN / ID / ZH content."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import order
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "BLE",  # blind except - selected so each one has to be justified inline
    "RUF",
]
ignore = [
    # FastAPI declares dependencies as call expressions in defaults by design.
    "B008",

    # This service exists to handle Chinese text. Full-width punctuation and
    # CJK characters in source and tests are the subject matter, not a
    # homoglyph attack, so the ambiguous-character rules are noise here.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
